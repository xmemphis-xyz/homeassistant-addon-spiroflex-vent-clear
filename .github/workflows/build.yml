name: Build and publish Home Assistant app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "spiroflex_vent_clear/**"
      - ".github/workflows/build.yml"

env:
  IMAGE_NAME: ghcr.io/xmemphis-xyz/spiroflex-vent-clear

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out app repository
        uses: actions/checkout@v6

      - name: Check out Go source repository
        uses: actions/checkout@v6
        with:
          repository: xmemphis-xyz/spiroflex-vent-clear
          path: source

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' spiroflex_vent_clear/config.yaml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./spiroflex_vent_clear/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
